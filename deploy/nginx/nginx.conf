worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    # Cloudflare / edge terminates TLS; origin speaks HTTP.
    # Do not log query strings (sync tokens may appear as fallback).
    log_format main '$remote_addr - $status rt=$request_time '
                    '"$request_method $uri" ua="$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream codeit_api {
        server api:9091;
        keepalive 16;
    }

    upstream codeit_sync {
        server sync:1234;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Prefer Cloudflare's client IP when present; otherwise the TCP peer.
    map $http_cf_connecting_ip $client_ip {
        default $http_cf_connecting_ip;
        ''      $remote_addr;
    }

    # Prefer Cloudflare visitor scheme when present.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name _;

        # Defense-in-depth headers (HSTS is enforced at Cloudflare for public HTTPS).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Monaco + Turnstile + SockJS + same-origin APIs. Tighten further if you drop CDNs.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https://challenges.cloudflare.com https://api.groq.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # Strip inbound spoofed XFF; set clean client identity for the API
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location /api/ {
            proxy_http_version 1.1;
            proxy_pass http://codeit_api;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        # STOMP / SockJS
        location /ws {
            proxy_http_version 1.1;
            proxy_pass http://codeit_api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /ws/ {
            proxy_http_version 1.1;
            proxy_pass http://codeit_api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Yjs: browser uses /sync/{doc}; strip /sync for the Node sync-server
        # Judge0 is NEVER proxied here — only API→JUDGE0_API_URL privately.
        location /sync/ {
            proxy_http_version 1.1;
            proxy_pass http://codeit_sync/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /sync {
            proxy_http_version 1.1;
            proxy_pass http://codeit_sync/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https://challenges.cloudflare.com https://api.groq.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
    }
}
