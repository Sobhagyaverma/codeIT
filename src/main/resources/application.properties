spring.application.name=codeit
server.port=9091
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codeit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ROOT}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
judge0.api.url=${JUDGE0_API_URL:https://judge0.ktatva.com}

# Redis is off by default so local/dev works without a Redis server.
# Rate limiting uses Redis when enabled; otherwise an in-memory fixed-window fallback.
# On the VM (production): set codeit.redis.enabled=true AND remove spring.autoconfigure.exclude below.
codeit.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Rate limiting (fixed-window counters).
# Login: 5 / 15 min / IP | Register: 3 / hour / IP | Change password: 5 / hour / user
# Forgot password (OTP): 1 / day / email AND 1 / day / IP (both must pass)
# Run / Submit: three tiers (burst + sustained + daily) — all must pass
codeit.ratelimit.enabled=true
codeit.ratelimit.login.limit=5
codeit.ratelimit.login.window-seconds=900
codeit.ratelimit.register.limit=3
codeit.ratelimit.register.window-seconds=3600
codeit.ratelimit.change-password.limit=5
codeit.ratelimit.change-password.window-seconds=3600
codeit.ratelimit.forgot-password.limit=1
codeit.ratelimit.forgot-password.window-seconds=86400

# Run — burst (spike) / sustained (abuse) / daily (bots + sharing)
codeit.ratelimit.run.burst.limit=3
codeit.ratelimit.run.burst.window-seconds=10
codeit.ratelimit.run.sustained.limit=8
codeit.ratelimit.run.sustained.window-seconds=60
codeit.ratelimit.run.daily.limit=300
codeit.ratelimit.run.daily.window-seconds=86400

# Submit — stricter than run (full test suite)
codeit.ratelimit.submit.burst.limit=2
codeit.ratelimit.submit.burst.window-seconds=10
codeit.ratelimit.submit.sustained.limit=5
codeit.ratelimit.submit.sustained.window-seconds=60
codeit.ratelimit.submit.daily.limit=150
codeit.ratelimit.submit.daily.window-seconds=86400

# AI — very strict (LLM cost)
codeit.ratelimit.ai.burst.limit=1
codeit.ratelimit.ai.burst.window-seconds=10
codeit.ratelimit.ai.sustained.limit=5
codeit.ratelimit.ai.sustained.window-seconds=60
codeit.ratelimit.ai.daily.limit=40
codeit.ratelimit.ai.daily.window-seconds=86400

# Room invite (create room + invite token)
codeit.ratelimit.room-invite.limit=10
codeit.ratelimit.room-invite.window-seconds=60
# Room chat
codeit.ratelimit.room-chat.limit=30
codeit.ratelimit.room-chat.window-seconds=60
# Leave+rejoin same room
codeit.ratelimit.room-join.limit=10
codeit.ratelimit.room-join.window-seconds=60
# Sync-token mint (Yjs)
codeit.ratelimit.room-sync-token.limit=20
codeit.ratelimit.room-sync-token.window-seconds=60
# Transfer host
codeit.ratelimit.room-transfer-host.limit=3
codeit.ratelimit.room-transfer-host.window-seconds=60
# Rename / host note
codeit.ratelimit.room-rename.limit=10
codeit.ratelimit.room-rename.window-seconds=60
# Public problem list/search/read (by IP)
codeit.ratelimit.problems-read.limit=90
codeit.ratelimit.problems-read.window-seconds=60
# Admin write APIs (problem create, competition admin, user delete)
codeit.ratelimit.admin-write.limit=15
codeit.ratelimit.admin-write.window-seconds=60

# Collaboration hard caps
codeit.collaboration.max-members-per-room=10
codeit.collaboration.max-chat-message-chars=2000
codeit.collaboration.max-stomp-sessions-per-user-per-room=2
codeit.collaboration.max-whiteboard-elements=2000
codeit.collaboration.max-whiteboard-strokes=500
codeit.collaboration.max-stroke-points=400
codeit.collaboration.max-undo-steps=50

codeit.cache.leaderboard-ttl-seconds=60
codeit.cache.competition-ttl-seconds=120
codeit.cache.problem-ttl-seconds=1800
codeit.cache.testcase-ttl-seconds=1800

codeit.judge.progressive-first-chunk=3
codeit.judge.batch-chunk-size=6
codeit.judge.poll-interval-ms=200
codeit.judge.poll-timeout-ms=60000
codeit.judge.case-timeout-seconds=3
codeit.judge.compile-once-cpu-time-limit=30
codeit.judge.compile-once-wall-time-limit=45
# Execution characteristics (Judge0 sandbox)
codeit.judge.max-source-bytes=1048576
codeit.judge.max-stdin-bytes=65536
codeit.judge.max-output-bytes=2097152
codeit.judge.cpu-time-limit-seconds=5
codeit.judge.wall-time-limit-seconds=10
codeit.judge.memory-limit-kb=262144
codeit.judge.max-file-size-kb=1024
codeit.judge.max-processes=10
codeit.http.connect-timeout-ms=3000
codeit.http.read-timeout-ms=60000
codeit.http.max-total=8
codeit.http.max-per-route=8

# RSA-OAEP for sensitive auth fields (login id, passwords). Defense-in-depth; use HTTPS in production.
codeit.crypto.rsa.enabled=true
codeit.crypto.rsa.private-key-path=data/codeit-rsa-private.pem
codeit.crypto.rsa.generate-if-missing=true
codeit.crypto.rsa.key-size=2048

codeit.jwt.secret=${CODEIT_JWT_SECRET:1234567891011121314151617181920212223242526272829303132}
codeit.jwt.expiration-ms=86400000

server.error.include-stacktrace=never
server.error.include-message=always


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

codeit.ai.enabled=true
codeit.ai.provider=groq
codeit.ai.groq.base-url=https://api.groq.com/openai/v1
codeit.ai.groq.api-key=${GROQ_API_KEY:}
codeit.ai.groq.model=openai/gpt-oss-20b
codeit.ai.groq.timeout-ms=30000
codeit.ai.max-code-chars=20000
# AI rate limits live under codeit.ratelimit.ai.* (3-tier)
