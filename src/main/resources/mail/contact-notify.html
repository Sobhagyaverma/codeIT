<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact message</title>
</head>
<body style="margin:0;padding:0;background:#09040D;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#09040D;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#12081A;border:1px solid #2A1A3A;border-radius:12px;">
          <tr>
            <td style="padding:28px 28px 8px;font-size:22px;font-weight:700;color:#B76DFF;letter-spacing:-0.02em;">CodeIT</td>
          </tr>
          <tr>
            <td style="padding:8px 28px 0;font-size:20px;font-weight:600;color:#F5F0FA;">New contact message</td>
          </tr>
          <tr>
            <td style="padding:16px 28px 0;font-size:13px;line-height:1.6;color:#B8A9C9;">
              <strong style="color:#F5F0FA;">Message ID:</strong> {{messageId}}<br/>
              <strong style="color:#F5F0FA;">Username:</strong> {{username}}<br/>
              <strong style="color:#F5F0FA;">User ID:</strong> {{userId}}<br/>
              <strong style="color:#F5F0FA;">Email:</strong> {{userEmail}}<br/>
              <strong style="color:#F5F0FA;">When:</strong> {{timestamp}}<br/>
              <strong style="color:#F5F0FA;">IP:</strong> {{clientIp}}<br/>
              <strong style="color:#F5F0FA;">User-Agent:</strong> {{userAgent}}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px 28px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#1A0F28;border:1px solid #3A2550;border-radius:10px;">
                <tr>
                  <td style="padding:16px 18px;font-size:14px;font-weight:600;color:#F5F0FA;">{{subject}}</td>
                </tr>
                <tr>
                  <td style="padding:0 18px 18px;font-size:14px;line-height:1.55;color:#B8A9C9;white-space:pre-wrap;">{{message}}</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
