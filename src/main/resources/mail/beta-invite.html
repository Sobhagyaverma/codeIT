<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your CodeT Private Beta invite</title>
</head>
<body style="margin:0;padding:0;background:#09040D;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#09040D;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#12081A;border:1px solid #2A1A3A;border-radius:12px;">
          <tr>
            <td style="padding:28px 28px 8px;font-size:22px;font-weight:700;color:#B76DFF;letter-spacing:-0.02em;">CodeT</td>
          </tr>
          <tr>
            <td style="padding:8px 28px 0;font-size:20px;font-weight:600;color:#F5F0FA;">You're invited to the Private Beta</td>
          </tr>
          <tr>
            <td style="padding:12px 28px 0;font-size:14px;line-height:1.5;color:#B8A9C9;">
              Hi {{name}}, welcome to CodeT Private Beta. Use the invite code below to register. This invite is bound to <strong style="color:#F5F0FA;">{{email}}</strong> and expires on {{expiresAt}}.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:28px;">
              <div style="display:inline-block;padding:16px 20px;background:#1A0F28;border:1px solid #3A2550;border-radius:10px;font-size:18px;letter-spacing:0.08em;font-weight:700;color:#F5F0FA;word-break:break-all;">
                {{inviteCode}}
              </div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 28px 28px;">
              <a href="{{registerUrl}}" style="display:inline-block;padding:12px 22px;background:#B76DFF;color:#12081A;text-decoration:none;border-radius:8px;font-weight:700;font-size:14px;">
                Create your account
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px;font-size:12px;line-height:1.5;color:#8A7A9A;">
              If the button does not work, open: {{registerUrl}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
