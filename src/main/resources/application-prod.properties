# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
#
# Required env (enforced by ProdSecurityValidator):
#   CODEIT_JWT_SECRET          (>= 32 chars, not the repo default)
#   CODEIT_OTP_PEPPER          (>= 16 chars, not the repo default)
#   SPRING_DATASOURCE_PASSWORD (>= 8 chars, not ROOT)
#   TURNSTILE_SITE_KEY
#   TURNSTILE_SECRET_KEY
#   CODEIT_CORS_ORIGINS        e.g. https://codeit.example.com
#
# Typical:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://...
#   SPRING_DATASOURCE_USERNAME=...
#   JUDGE0_API_URL=http://127.0.0.1:2358
#   CODEIT_TRUST_FORWARDED_HEADERS=true   (behind Nginx/Cloudflare)

codeit.captcha.enabled=true
codeit.security.trust-forwarded-headers=${CODEIT_TRUST_FORWARDED_HEADERS:true}

# Never generate ephemeral RSA keys in prod unless a persistent volume is mounted.
codeit.crypto.rsa.generate-if-missing=${CODEIT_CRYPTO_RSA_GENERATE_IF_MISSING:false}
codeit.crypto.rsa.private-key-path=${CODEIT_CRYPTO_RSA_PRIVATE_KEY_PATH:data/codeit-rsa-private.pem}

# Graceful shutdown for rolling deploys / docker stop
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# When Redis is the rate-limit backend, auth policies deny on Redis errors (no bypass).
codeit.ratelimit.fail-closed-on-redis-error=true
